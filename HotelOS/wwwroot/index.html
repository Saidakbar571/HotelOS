<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelOS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ═══ LOGIN ══════════════════════════════════════════════ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">🏨</div>
    <h1>HotelOS</h1>
    <p class="login-sub">GrandStay Mehmonxona Boshqaruv Tizimi</p>

    <div class="form-group">
      <label>Account ID</label>
      <input id="loginId" type="text" value="REC001" placeholder="GST001 / REC001 / HK001">
    </div>
    <div class="form-group">
      <label>Parol</label>
      <input id="loginPwd" type="password" value="admin123">
    </div>

    <button class="btn btn-primary btn-full" onclick="login()">Kirish</button>

    <div class="login-hints">
      <strong>Demo hisoblar:</strong><br>
      💼 Qabulchi : REC001 / admin123<br>
      👤 Mehmon   : GST001 / guest123<br>
      🧹 Xizmatchi: HK001  / hk123
    </div>

    <div id="loginError" class="alert alert-danger hidden"></div>
  </div>
</div>

<!-- ═══ APP ════════════════════════════════════════════════ -->
<div id="app" class="hidden">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">🏨</div>
      <div>
        <div class="sidebar-brand-text">HotelOS</div>
        <div class="sidebar-brand-sub">GrandStay</div>
      </div>
    </div>
    <div id="userInfo" class="user-info"></div>
    <nav id="sidebarNav" class="sidebar-nav"></nav>
    <button class="btn-logout" onclick="logout()">
      <span>↩</span> Chiqish
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div id="pageColorDot" class="page-color-dot"></div>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <span id="clock" class="topbar-clock"></span>
        <a href="/scalar/v1" target="_blank" class="swagger-link">📚 API UI</a>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>

</div>

<!-- ═══ MODAL ══════════════════════════════════════════════ -->
<div id="modal" class="modal-overlay hidden" onclick="onModalOverlayClick(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Toast xabarnoma -->
<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>

</body>
</html>
